[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "f1-predictive-analytics"
version = "0.1.0"
description = "Reproducible Formula 1 data pipeline and predictive models (qualifying lap times, race results)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Raúl Emiliano Guzmán Acevedo" }]
keywords = ["formula-1", "motorsport", "machine-learning", "data-engineering", "fastf1"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
# Only what the code uses today. scikit-learn etc. are added in the milestone
# that first needs them.
dependencies = [
    "fastf1>=3.8,<4",
    # FastF1 3.8 requires pandas<3 and numpy<3; pinned explicitly so the
    # constraint is visible here rather than only in the lockfile.
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/f1_predictive_analytics"]

[tool.uv]
# Use a uv-managed interpreter so the active conda base env is never picked up.
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH", "RUF"]
